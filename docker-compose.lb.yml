# Mở rộng tùy chọn của CP4: nhiều instance agent phía sau Nginx.
#
#   docker compose -f docker-compose.yml -f docker-compose.lb.yml up -d --scale agent=3
#   curl http://localhost:8080/health
#
# Agent không publish cổng 8000 nữa (3 container không thể cùng giữ một cổng
# host); mọi request đi qua Nginx ở cổng 8080, round-robin tới từng container.

services:
  agent:
    ports: !reset []

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent:
        condition: service_healthy
